- name: Download Ollama installer
  ansible.builtin.get_url:
    url: "{{ ollama_install_url }}"
    dest: "{{ ollama_install_script }}"
    owner: root
    group: root
    mode: '0755'

- name: Install Ollama
  ansible.builtin.command:
    cmd: "{{ ollama_install_script }}"
    creates: /usr/local/bin/ollama

- name: Mark Ollama data as excluded from Borg backups
  ansible.builtin.file:
    path: /usr/share/ollama/.nobackup
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  tags: borgexclude

- name: Create Ollama systemd drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ ollama_service }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Ollama systemd drop-ins
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ ollama_service }}.service.d/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
  with_fileglob:
    - ../templates/systemd/*.conf.j2
  notify: Restart Ollama

- name: Enable and start Ollama
  ansible.builtin.systemd:
    name: "{{ ollama_service }}"
    enabled: true
    state: started
